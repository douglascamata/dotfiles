model = "gpt-6.1-sol"
review_model = "gpt-6.1-sol"
service_tier = "default"

model_reasoning_summary = "auto"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"

personality = "pragmatic"
web_search = "live"

# Use a tool to search for MCPs, saving context
search_tool = true

[sandbox_workspace_write]
network_access = true

[tui]
show_raw_agent_reasoning = true
status_line = [
  "run-state",
  "current-dir",
  "git-branch",
  "pull-request-number",
  "model-with-reasoning",
  "context-used",
  "context-window-size",
  "total-input-tokens",
  "total-output-tokens",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
  "thread-credits",
  "estimated-thread-cost",
]
session_picker_view = "dense"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[memories]
generate_memories = false
use_memories = false

[features]
unified_exec = true
shell_snapshot = true
multi_agent = true
prevent_idle_sleep = true
apps = true
undo = true
terminal_resize_reflow = true
chronicle = false
local_thread_store_compression = true
memories = false

[desktop]
appearanceLightCodeThemeId = "codex"
usePointerCursors = true
followUpQueueMode = "steer"
reviewDelivery = "detached"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = false
git-show-sidebar-pr-icons = true
git-commit-instructions = ""
worktree-keep-count = 5
mac-menu-bar-enabled = false
git-create-pull-request-as-draft = true
git-pull-request-merge-method = "squash"
git-pr-instructions = "Before writing the PR description/title, look for contribution guidelines (i.e. in a `CONTRIBUTING.md` file) and pull request template (i.e. in `./.github/pull_request_template.md`)."
notifications-turn-mode = "always"
notifications-permissions-enabled = true
show-context-window-usage = true
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
dictationDictionary = []
selected-avatar-id = "null-signal"
dock-icon-preference = "codex-system"
avatar-overlay-mascot-width-px = 131
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
show-ultra-in-model-picker-slider = true
notifications-questions-enabled = true

[desktop.appearanceLightChromeTheme.fonts]
code = "Berkeley Mono Variable"

[desktop.appearanceDarkChromeTheme.fonts]
code = "Berkeley Mono Variable"

[desktop.open-in-target-preferences]
global = "zed"

[desktop.appearanceLightChromeTheme]
accent = "#0169cc"
contrast = 45
ink = "#0d0d0d"
opaqueWindows = true
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#751ed9"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 60
ink = "#ffffff"
opaqueWindows = true
surface = "#181818"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
